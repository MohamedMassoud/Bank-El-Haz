function card(s,p,i){

 if(k==='$'){c[2]>0?p.m+=c[2]:pay(s,p,null,-c[2])}
 else if(k==='m')go(s,p,c[2]);
 else if(k==='j')jail(s,p);
 else if(k==='a'){s.P.forEach((x,j)=>{if(j!==i&&!x.out)pay(s,x,i,c[2])})}
 else if(k==='p'){s.P.forEach((x,j)=>{if(j!==i&&!x.out&&!p.out)pay(s,p,j,c[2])})}
 else if(k==='b'){p.pos=(p.pos+N-c[2])%N;land(s,p)}

 if(q[1]==='g'){jail(s,p);return}
 if(q[1]==='c')card(s,p,i)}

// ===== trading =====
function validTrade(s,t){
 const A=s.P[t.from],B=s.P[t.to];if(!A||!B||A.out||B.out||t.from===t.to)return false;
 if(t.gm<0||t.wm<0||A.m<t.gm||B.m<t.wm)return false;
 if(!t.gp.every(k=>s.O[k]===t.from&&!grpH(s,k))||!t.wp.every(k=>s.O[k]===t.to&&!grpH(s,k)))return false;
 return t.gm+t.wm+t.gp.length+t.wp.length>0}
function execTrade(s,t){
 const A=s.P[t.from],B=s.P[t.to];A.m+=t.wm-t.gm;B.m+=t.gm-t.wm;
 t.gp.forEach(k=>{s.O[k]=t.to;if(s.V)delete s.V[k]});t.wp.forEach(k=>{s.O[k]=t.from;if(s.V)delete s.V[k]});

function trSend(s,arg){
 let o;try{o=JSON.parse(arg)}catch(e){return false}
 const ints=a=>(Array.isArray(a)?a:[]).map(Number).filter(k=>k>=0&&k<N);

 if(!validTrade(s,t))return false;

function trAct(s,k){const t=s.tr;
 if(k==='tcancel'){L(s,'العرض اتلغى');s.tr=null;return true}
 if(k==='trej'){L(s,`${s.P[t.to].n} رفض العرض ❌`);s.tr=null;return true}
 if(k==='tacc'){if(validTrade(s,t))execTrade(s,t);else L(s,'العرض ما بقاش صالح');s.tr=null;return true}

function propAct(s,k,sq){
 const i=s.t,p=s.P[i];if(!(sq>=0&&sq<N)||s.O[sq]!==i)return false;

 if(k==='bld'){if(!canBuild(s,i,sq))return false;p.m-=bcost(sq);s.H[sq]=hh(s,sq)+1;L(s,`${p.n} بنى ${s.H[sq]>=5?'فندق 🏨':'بيت 🏠'} في ${n}`);return true}
 if(k==='sell'){if(!canSell(s,sq))return false;p.m+=bcost(sq)/2;s.H[sq]--;if(!s.H[sq])delete s.H[sq];L(s,`${p.n} باع بيت من ${n}`);return true}

 if(k==='unmort'){if(!mg(s,sq)||p.m<ucost(sq))return false;p.m-=ucost(sq);delete s.M[sq];L(s,`${p.n} فك رهن ${n} 🔓`);return true}

function doRoll(s){

  if(dbl){p.jail=0;L(s,p.n+' طلع من السجن بدبل!');step()}
  else{p.jail++;if(p.jail>3){p.jail=0;L(s,p.n+' دفع 50 وخرج');pay(s,p,null,50);if(!p.out)step()}else{L(s,p.n+' لسه في السجن');s.ph='end'}}

function endTurn(s){

 if(k==='join'){

  const id=local?'l'+s.P.length:me;if(s.P.some(x=>x.id===id))return;

function bVal(s,i,k){const q=S[k];let v=q[2]*(mg(s,k)?.6:1);if(q[1]==='p'&&GRP[q[3]].every(x=>x===k||s.O[x]===i))v*=1.5;return v}

function botBuild(s){const i=s.t,p=s.P[i];if(p.m<500)return null;
 let b=null;for(const k in s.O)if(s.O[k]===i&&canBuild(s,i,+k)&&p.m-bcost(+k)>300&&(b===null||bcost(+k)<bcost(b)))b=+k;return b}
