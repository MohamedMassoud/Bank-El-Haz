<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك الحظ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff1a8;--card:#fffdf0;--tx:#2b2200;--mut:#6b5d1a;--ac:#c8102e;--bd:#2b2200;--btn:#c8102e;--btx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a0a;--card:#2a2610;--tx:#fff4c9;--mut:#cdbf7a;--ac:#ff6b7d;--bd:#fff4c9;--btn:#ff6b7d;--btx:#1d1a0a}}
:root[data-theme="dark"]{--bg:#1d1a0a;--card:#2a2610;--tx:#fff4c9;--mut:#cdbf7a;--ac:#ff6b7d;--bd:#fff4c9;--btn:#ff6b7d;--btx:#1d1a0a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding:10px;max-width:720px;margin:auto}
h1{margin:4px 0 8px;font-size:1.5rem;color:var(--ac);text-align:center}
.board{direction:ltr;display:grid;grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;aspect-ratio:1;border:2px solid var(--bd);background:var(--card);gap:1px}
.sq{direction:rtl;position:relative;border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(5.5px,1.55vw,10px);line-height:1.15;overflow:hidden;background:var(--card);padding:1px}
.sq i{display:block;width:100%;height:20%;min-height:3px;position:absolute;top:0;left:0}
.sq b{font-size:1.3em}
.tk{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;position:absolute;bottom:1px}
.tk u{width:clamp(6px,1.9vw,12px);height:clamp(6px,1.9vw,12px);border-radius:50%;border:1px solid #fff;display:block}
.mid{grid-area:2/2/11/11;direction:rtl;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:6px;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(200,16,46,.06) 12px 24px)}
.mid .t{font-size:clamp(18px,6vw,38px);font-weight:800;color:var(--ac)}
.dice{font-size:clamp(30px,10vw,64px);letter-spacing:6px}
.log{font-size:clamp(10px,2.6vw,14px);color:var(--mut);min-height:3em}
.panel{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px}
button{font:inherit;background:var(--btn);color:var(--btx);border:0;border-radius:10px;padding:10px 16px;margin:3px;cursor:pointer;font-weight:700}
button.s{background:transparent;color:var(--tx);border:2px solid var(--bd)}
button:disabled{opacity:.5}
input{font:inherit;padding:9px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.pl{display:flex;align-items:center;gap:8px;padding:4px 0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.me{font-weight:800}
h1{background:linear-gradient(90deg,var(--ac),#f4a300,var(--ac));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
.mid .t{animation:glow 2.5s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 14px var(--ac);transform:scale(1.05)}}
.dice.roll{animation:roll .8s cubic-bezier(.2,.8,.3,1)}
@keyframes roll{0%{transform:rotate(0) scale(.3) translateY(-40px);opacity:.2}60%{transform:rotate(540deg) scale(1.35)}100%{transform:rotate(720deg) scale(1);opacity:1}}
.sq.pop{animation:pop .7s;z-index:2}
@keyframes pop{30%{transform:scale(1.4);box-shadow:0 0 14px 4px #f4a300}}
.sq.nw{animation:nw 1.1s}
@keyframes nw{0%{filter:brightness(2.4) saturate(2)}100%{filter:none}}
.tk u.cur{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.7)}}
.shake{animation:shk .5s}
@keyframes shk{20%{transform:translateX(-8px) rotate(-.6deg)}40%{transform:translateX(8px) rotate(.6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fl{margin-inline-start:auto;animation:fl 1.6s forwards}
.fl.up{color:#2a9d4f}.fl.dn{color:#e63946}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate(-50%,-150%);background:var(--btn);color:var(--btx);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none}
#toast.on{animation:tt 3s forwards}
@keyframes tt{10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-150%)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;animation:cf linear forwards;pointer-events:none}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
button{transition:transform .1s}button:active{transform:scale(.93)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
small{color:var(--mut)}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;z-index:0}
.sq b,.sq span,.sq small{position:relative;z-index:1}
.sq i{z-index:1}
.tk{z-index:2}
.sq span,.sq small{font-weight:700;text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 5px var(--card)}
.hero{width:100%;height:clamp(110px,30vw,200px);object-fit:cover;border-radius:10px;border:2px solid var(--bd);margin-bottom:6px;background:var(--card)}
svg.hero{height:auto;max-height:260px}
.pcard{display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(10px,2.8vw,15px);max-width:100%}
.pcard img{height:clamp(34px,12vw,84px);max-width:46vw;object-fit:cover;border-radius:8px;border:2px solid var(--bd)}
</style></head><body>
<h1>🎲 بنك الحظ</h1>
<button id="mu" class="s" onclick="mute()" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);inset-inline-start:8px;padding:4px 10px;margin:0;z-index:40">🔊</button><div id="toast"></div><div id="app"><p>جاري الاتصال…</p></div>
<script>
const S=[["البداية","go"],["الأقصر","p",60,0],["حظ","c"],["أسوان","p",60,0],["ضريبة دخل","t",200],["مطار القاهرة","r",200],["الإسكندرية","p",100,1],["حظ","c"],["بورسعيد","p",100,1],["شرم الشيخ","p",120,1],["السجن","j"],["صنعاء","p",140,2],["شركة الكهرباء","u",150],["الخرطوم","p",140,2],["مسقط","p",160,2],["ميناء السويس","r",200],["الكويت","p",180,3],["حظ","c"],["الدوحة","p",180,3],["المنامة","p",200,3],["استراحة","f"],["بيروت","p",220,4],["حظ","c"],["عمّان","p",220,4],["دمشق","p",240,4],["ميناء دمياط","r",200],["تونس","p",260,5],["الجزائر","p",260,5],["شركة المياه","u",150],["الرباط","p",280,5],["اذهب للسجن","g"],["أبوظبي","p",300,6],["دبي","p",300,6],["حظ","c"],["الرياض","p",320,6],["محطة مصر","r",200],["حظ","c"],["جدة","p",350,7],["ضريبة رفاهية","t",100],["القاهرة","p",400,7]];
const FL={1:'🇪🇬',3:'🇪🇬',5:'🇪🇬',6:'🇪🇬',8:'🇪🇬',9:'🇪🇬',11:'🇾🇪',13:'🇸🇩',14:'🇴🇲',15:'🇪🇬',16:'🇰🇼',18:'🇶🇦',19:'🇧🇭',21:'🇱🇧',23:'🇯🇴',24:'🇸🇾',25:'🇪🇬',26:'🇹🇳',27:'🇩🇿',28:'💧',29:'🇲🇦',31:'🇦🇪',32:'🇦🇪',34:'🇸🇦',35:'🇪🇬',37:'🇸🇦',39:'🇪🇬'};
const GC=['#8b5a2b','#7ec8e3','#e87fb5','#f39c34','#e03c31','#f2d11a','#2e9e5b','#2a5bd7'];
const PC=['#e63946','#1d6fd8','#2a9d4f','#9b59b6','#f4a300','#00a6a6'];
const IC={go:'🏁',c:'❓',t:'💸',r:'🚆',u:'💡',j:'🚔',f:'🅿️',g:'👮'};
const CARDS=[["البنك دفعلك أرباح +150","$",150],["مخالفة مرور -50","$",-50],["روح البداية وخد 200","m",0],["سافر شرم الشيخ ✈️","m",9],["روح القاهرة","m",39],["ادخل السجن! 🚔","j"],["عيد ميلادك: كل لاعب يدفعلك 20","a",20],["صلّحت العربية -100","$",-100],["كسبت جايزة يانصيب +200","$",200],["ارجع 3 خطوات","b",3]];
let G=null,me=null,ref=null,local=false,busy=false,err='';
let ROOM=location.hash.slice(1).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,20);
if(!ROOM){ROOM=Math.random().toString(36).slice(2,8);history.replaceState(null,'','#'+ROOM)}
window.ROOM=ROOM;window.fbReady=new Promise(r=>{window.fbResolve=r});
addEventListener('hashchange',()=>location.reload());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fresh=()=>({st:0,P:[],O:{},t:0,ph:'roll',d:[1,1],log:[],w:null,again:false});
const cur=s=>s.P[s.t];
const L=(s,m)=>{s.log=[m,...s.log].slice(0,5)};
const posOf=i=>i<=10?[11,11-i]:i<=20?[11-(i-10),1]:i<=30?[1,1+(i-20)]:[1+(i-30),11];

function pay(s,p,to,amt){p.m-=amt;if(to!=null)s.P[to].m+=amt;if(p.m<0)bust(s,p)}
function bust(s,p){const i=s.P.indexOf(p);p.out=true;p.m=0;for(const k in s.O)if(s.O[k]===i)delete s.O[k];L(s,p.n+' أفلس! 💀');const a=s.P.filter(x=>!x.out);if(a.length===1)s.w=s.P.indexOf(a[0])}
function jail(s,p){p.pos=10;p.jail=1;L(s,p.n+' دخل السجن 🚔')}
function go(s,p,to){if(to<p.pos){p.m+=200;L(s,p.n+' عدّى البداية +200')}p.pos=to;land(s,p)}
function owned(s,i,list){return list.filter(k=>s.O[k]===i).length}
function land(s,p){
 const i=s.P.indexOf(p),q=S[p.pos],o=s.O[p.pos];s.ph='end';
 if(q[1]==='p'||q[1]==='r'||q[1]==='u'){
  if(o===undefined){if(p.m>=q[2])s.ph='buy';else L(s,'مفيش فلوس كفاية تشتري '+q[0]);return}
  if(o===i||s.P[o].out)return;
  let r;
  if(q[1]==='p'){const g=S.map((x,k)=>x[3]===q[3]&&x[1]==='p'?k:-1).filter(k=>k>=0);r=q[2]/10;if(g.every(k=>s.O[k]===o))r*=2}
  else if(q[1]==='r')r=25*2**(owned(s,o,[5,15,25,35])-1);
  else r=(owned(s,o,[12,28])===2?10:4)*(s.d[0]+s.d[1]);
  r=Math.round(r);L(s,`${p.n} دفع ${r} إيجار لـ ${s.P[o].n}`);pay(s,p,o,r);return}
 if(q[1]==='t'){L(s,`${p.n} دفع ${q[2]} ${q[0]}`);pay(s,p,null,q[2]);return}
 if(q[1]==='g'){jail(s,p);return}
 if(q[1]==='c'){
  const c=CARDS[Math.floor(Math.random()*CARDS.length)];L(s,'❓ '+c[0]);
  if(c[1]==='$'){c[2]>0?p.m+=c[2]:pay(s,p,null,-c[2])}
  else if(c[1]==='m')go(s,p,c[2]);
  else if(c[1]==='j')jail(s,p);
  else if(c[1]==='a'){s.P.forEach((x,k)=>{if(k!==i&&!x.out)pay(s,x,i,c[2])})}
  else if(c[1]==='b'){p.pos=(p.pos+37)%40;land(s,p)}
 }
}
function doRoll(s){
 const p=cur(s),d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)],dbl=d[0]===d[1];s.d=d;s.rc=(s.rc||0)+1;
 const step=()=>{const n=(p.pos+d[0]+d[1])%40;if(n<p.pos){p.m+=200;L(s,p.n+' عدّى البداية +200')}p.pos=n;land(s,p)};
 if(p.jail>0){
  if(dbl){p.jail=0;L(s,p.n+' طلع من السجن بدبل!');step()}
  else{p.jail++;if(p.jail>3){p.jail=0;L(s,p.n+' دفع 50 وخرج');pay(s,p,null,50);if(!p.out)step()}else{L(s,p.n+' لسه في السجن');s.ph='end'}}
  s.again=false;return}
 step();s.again=dbl&&!p.jail&&!p.out&&s.w==null;
}
function endTurn(s){
 if(s.again&&!cur(s).out){s.again=false;s.ph='roll';return}
 do{s.t=(s.t+1)%s.P.length}while(cur(s).out);s.ph='roll';s.again=false;
}
function act(k,arg){
 if(busy)return;const s=G?JSON.parse(JSON.stringify(G)):fresh();
 if(k==='join'){
  const n=(arg||'').trim().slice(0,14);if(!n||s.P.length>=6)return;
  if(!local&&!me)me='g'+Math.random().toString(36).slice(2,8);
  const id=local?'l'+s.P.length:me;if(s.P.some(x=>x.id===id))return;
  s.P.push({id,n,c:s.P.length,pos:0,m:1500,jail:0,out:false})}
 else if(k==='bot'){if(s.P.length>=6)return;const nb=s.P.filter(x=>x.bot).length+1;s.P.push({id:'bot'+s.P.length,n:'🤖 بوت '+nb,c:s.P.length,pos:0,m:1500,jail:0,out:false,bot:true})}
 else if(k==='start'){if(s.P.length<2)return;s.st=1;s.t=0;s.ph='roll';L(s,'اللعبة بدأت! 🎉')}
 else if(k==='reset'){if(Date.now()>RC){RC=Date.now()+3000;render();setTimeout(render,3100);return}RC=0;Object.assign(s,fresh())}
 else{const p=cur(s);
  if(k==='roll'&&s.ph==='roll')doRoll(s);
  else if(k==='buy'&&s.ph==='buy'){const q=S[p.pos];p.m-=q[2];s.O[p.pos]=s.t;s.ph='end';L(s,`${p.n} اشترى ${q[0]} 🏠`)}
  else if(k==='skip'&&s.ph==='buy')s.ph='end';
  else if(k==='end'&&s.ph==='end')endTurn(s);
  else if(k==='payj'&&p.jail>0&&s.ph==='roll'){p.jail=0;pay(s,p,null,50);L(s,p.n+' دفع 50 وخرج من السجن')}
  else return}
 save(s)}
async function save(s){
 G=s;render();if(!ref)return;busy=true;
 try{await ref.set(s);err=''}catch(e){err='مش قادر أحفظ الحركة: '+(e&&e.message||'')}
 busy=false;render()}
function board(s){
 let h='';
 for(let i=0;i<40;i++){
  const q=S[i],[r,c]=posOf(i),o=s.O[i],tk=s.P.map((p,k)=>!p.out&&(DP[k]!==undefined?DP[k]:p.pos)===i?`<u class="${k===s.t&&s.w==null?'cur':''}" style="background:${PC[p.c]};animation-delay:-${(Date.now()%1000)/1000}s"></u>`:'').join(''),pop=fx('pop')&&fx('pop').has(i),nw=fx('nw')&&fx('nw').has(i);
  h+=`<div class="sq${pop?' pop':''}${nw?' nw':''}" style="grid-area:${r}/${c};${o!=null?`box-shadow:inset 0 0 0 3px ${PC[s.P[o].c]}`:''}${(pop||nw)?';'+ad(FX.ls):''}">${IMG[i]?`<img class="ph" src="${esc(IMG[i])}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}${q[1]==='p'?`<i style="background:${GC[q[3]]}"></i>`:''}<b>${FL[i]||IC[q[1]]||''}</b><span>${esc(q[0])}</span>${q[2]?`<small>${q[2]}</small>`:''}<div class="tk">${tk}</div></div>`}
 const D='⚀⚁⚂⚃⚄⚅';
 h+=`<div class="mid"><div class="t" style="animation-delay:-${(Date.now()%2500)/1000}s">بنك الحظ</div>${pcard()}<div class="dice${fxr()?' roll':''}"${fxr()?` style="${ad(FX.rs)}"`:''}>${D[s.d[0]-1]}${D[s.d[1]-1]}</div><div class="log">${s.log.map(esc).join('<br>')}</div></div>`;
 return h}
function controls(s){
 if(s.w!=null)return `<b>🏆 الفايز: ${esc(s.P[s.w].n)} — مبروك!</b>`;
 const p=cur(s),my=local||p.id===me;
 if(MOVING)return `<b>🎲 …</b>`;
 if(p.bot)return `<b>🤖 ${esc(p.n)} بيلعب…</b>`;
 if(!my)return `<b>⏳ دور ${esc(p.n)}…</b>`;
 const B=(k,t,c)=>`<button class="${c||''}" onclick="act('${k}')">${t}</button>`;
 let h=`<b>دورك يا ${esc(p.n)}</b><br>`;
 if(s.ph==='roll')h+=B('roll',p.jail>0?'🎲 ارمي (دبل يخرجك)':'🎲 ارمي النرد')+(p.jail>0?B('payj','💰 ادفع 50 واخرج','s'):'');
 if(s.ph==='buy')h+=B('buy',`🏠 اشتري ${esc(S[p.pos][0])} بـ ${S[p.pos][2]}`)+B('skip','تخطى','s');
 if(s.ph==='end')h+=B('end',s.again?'🎲 ارمي تاني (دبل!)':'خلّص دورك');
 return h}
function render(){
 const a=document.getElementById('app'),G0=G;
 if(!G0&&!ref&&!local){return}
 calcFx(G0);const s=(MOVING&&VIEW)?VIEW:G0,st=s&&s.st;let h='';
 if(!st){
  const P=s?s.P:[],joined=!local&&P.some(x=>x.id===me);
  h+=`<div class="panel">${poster()}<b>غرفة الانتظار</b> <small>${local?'(لعب على جهاز واحد)':'(أونلاين — افتح نفس اللينك مع صحابك)'}</small>`;
  if(!local)h+=`<div><small>كود الغرفة: <b>${esc(ROOM)}</b> — ابعت اللينك ده لصحابك</small><input readonly value="${esc(location.href)}" onclick="this.select()" style="width:100%;margin:4px 0"></div>`;
  h+=P.map(p=>`<div class="pl"><span class="dot" style="background:${PC[p.c]}"></span>${esc(p.n)}</div>`).join('')||'<p><small>لسه محدش دخل</small></p>';
  if(!joined&&P.length<6)h+=`<div><input id="nm" placeholder="اسمك" maxlength="14"> <button onclick="act('join',document.getElementById('nm').value)">${local?'ضيف لاعب':'ادخل'}</button></div>`;
  if(P.length<6)h+=`<button class="s" onclick="act('bot')">🤖 ضيف بوت</button>`;
  if(P.length>=2&&(local||(P[0]&&P[0].id===me)))h+=`<button onclick="act('start')">▶️ ابدأ اللعبة</button>`;
  else if(P.length>=2)h+=`<p><small>مستنيين ${esc(P[0].n)} يبدأ اللعبة</small></p>`;
  h+=`</div>`}
 else{
  h+=`<div class="board${fx('shake')?' shake':''}"${fx('shake')?` style="${ad(FX.ls)}"`:''}>${board(s)}</div><div class="panel" style="text-align:center">${controls(s)}</div><div class="panel">`;
  h+=s.P.map((p,i)=>`<div class="pl ${p.id===me?'me':''}"><span class="dot" style="background:${PC[p.c]}"></span>${i===s.t&&s.w==null?'▶ ':''}${esc(p.n)}${p.id===me?' (أنت)':''} — 💰 ${p.m} — 🏠 ${Object.values(s.O).filter(v=>v===i).length}${p.jail?' 🚔':''}${p.out?' 💀':''}${fx('dm')&&fx('dm')[i]?`<b class="fl ${fx('dm')[i]>0?'up':'dn'}" style="${ad(FX.ls)}">${fx('dm')[i]>0?'+':''}${fx('dm')[i]}</b>`:''}</div>`).join('');
  h+=`<button class="s" id="rs" onclick="act('reset')">${Date.now()<RC?'متأكد؟ اضغط تاني':'لعبة جديدة'}</button></div>`}
